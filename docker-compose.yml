version: "3.9"

services:
  loteria:
    build: .
    container_name: loteria-hash-chain
    ports:
      - "3005:3005"
    environment:
      - DB_PATH=/data/loteria.db
      - PORT=3005
    volumes:
      - ./data:/data
    # en local: la BD queda en ./data (persistente en el host)
    restart: unless-stopped
